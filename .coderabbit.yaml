# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews only when asked. Codex reviews every PR (land-pr's adversarial-review), and
# pr-ready asks CodeRabbit to review this fork's PRs, since forks always get one, unless the
# `skip-coderabbit` label waives it. Reviews past the hourly allowance are billed per file.
reviews:
  auto_review:
    enabled: false
