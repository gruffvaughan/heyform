# Builds the image the live server runs while fixes wait on an upstream release.
# The `production` branch is an upstream release tag plus this workflow and the
# pending fixes; the server switches to it with HEYFORM_IMAGE in /opt/heyform/.env.
name: Publish Production Image

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production-image
  cancel-in-progress: true

jobs:
  push_to_registry:
    name: Push image to GitHub Container Registry
    # A manual run from another branch would otherwise publish that code as `production`.
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=production
            type=sha,prefix=production-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
